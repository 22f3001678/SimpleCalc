name: Load Testing (k6)

on:
  workflow_dispatch:

jobs:
  k6-loadtest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      - name: Install k6
        uses: grafana/setup-k6@v2
        with:
          k6-version: '0.47.0'
      - name: Start backend server
        run: |
          cd backend
          npm start &
          npx wait-on http://127.0.0.1:3001/api/calculate
      - name: Run k6 load test
        run: k6 run loadtest/k6/script.js
