name: Frontend Build & Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: |
          cd frontend
          npm ci
      - name: Run frontend tests
        run: |
          cd frontend
          npm ci
          npm run test:ci
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Optionally configure CNAME (custom domain)
        if: ${{ secrets.PUBLIC_DOMAIN != '' }}
        run: |
          cd frontend/dist || exit 0
          echo "${{ secrets.PUBLIC_DOMAIN }}" > CNAME
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
