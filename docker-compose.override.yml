version: '3.8'
services:
  backend:
    volumes:
      - ./backend:/usr/src/app
    command: npm run dev
    ports:
      - '3001:3001'
  frontend:
    volumes:
      - ./frontend:/usr/src/app
    command: npm run dev --prefix frontend
    ports:
      - '4173:4173'

# This override enables fast local development with bind mounts and dev servers.